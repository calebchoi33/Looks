<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LooksMaxx</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <nav>
        <div class="logo">LooksMaxx</div>
        <div class="auth-buttons">
            <button id="authBtn">Login / Sign Up</button>
            <div id="userMenu" class="hidden">
                <button id="logoutBtn">Logout</button>
                <button id="deleteAccountBtn">Delete Account</button>
            </div>
        </div>
    </nav>

    <div class="modal hidden" id="authModal">
        <div class="modal-content">
            <span class="close">&times;</span>
            <div id="login-form" class="form-container">
                <h2>Login</h2>
                <form id="loginForm">
                    <input type="email" id="loginEmail" placeholder="Email" required>
                    <input type="password" id="loginPassword" placeholder="Password" required>
                    <button type="submit">Sign In</button>
                </form>
                <p>Don't have an account? <a href="#" id="showSignup">Sign up</a></p>
            </div>

            <div id="signup-form" class="form-container hidden">
                <h2>Sign Up</h2>
                <form id="signupForm">
                    <input type="email" id="signupEmail" placeholder="Email" required>
                    <input type="password" id="signupPassword" placeholder="Password" required>
                    <button type="submit">Sign Up</button>
                </form>
                <p>Already have an account? <a href="#" id="showLogin">Login</a></p>
            </div>
        </div>
    </div>

    <main>
        <div class="camera-section">
            <div id="camera-container">
                <video id="video" autoplay playsinline></video>
                <div class="camera-controls">
                    <button id="cameraBtn">Start Camera</button>
                    <button id="closeCamera" class="hidden">Stop Camera</button>
                </div>
            </div>
        </div>
    </main>

    <script src="app.js"></script>
</body>
</html>
